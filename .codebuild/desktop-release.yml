# PREPARED, NOT CONNECTED: build the macOS app and publish it. Needs a macOS build machine, which costs money
# the owner has not approved yet (docs/ci/README.md has the options, real prices and the quota to request).
# No Mac host or fleet exists for it, and no CodeBuild project uses this file yet.
#
# It runs scripts/mac-release.sh, the same script a person runs on their own Mac, so there is one release path:
#   build OpenKT-<version>-arm64.dmg + .zip → s3://openkt-downloads-724772068721/desktop/releases/<version>/
#   → desktop/OpenKT-latest-arm64.dmg (the openkt.ai download) → desktop/latest.json (the in-app updater) LAST.
#
# To connect it (after approval): a CodeBuild project on a macOS reserved-capacity fleet in us-east-1
# (environment type MAC_ARM), source masti-ai/OpenKT-ai through the `openkt-github` connection, this buildspec,
# and a service role that may write s3://openkt-downloads-724772068721/desktop/* plus its own logs.
version: 0.2
env:
  shell: bash
phases:
  install:
    commands:
      - sw_vers && uname -m && xcode-select -p
  build:
    commands:
      - OPENKT_SRC="${CODEBUILD_SRC_DIR}" OPENKT_REF="${CODEBUILD_RESOLVED_SOURCE_VERSION}" bash scripts/mac-release.sh
