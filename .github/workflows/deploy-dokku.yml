name: Deploy to Dokku

# Same private deployment path as the original OpenKT backend (designed by Ojas Sinha):
# GitHub OIDC → short-lived AWS session → immutable source archive in S3 → Systems Manager
# streams it into Dokku. No SSH, no stored AWS keys. See docs/DEPLOY.md.

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "docker/**"
      - ".dokku/**"
      - "deploy/dokku/**"
      - ".github/workflows/deploy-dokku.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openkt-next-dokku-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate server
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Type-check
        working-directory: server
        run: npm run typecheck

      - name: Unit tests
        working-directory: server
        run: npm run test:unit

      - name: Build API
        working-directory: server
        run: npm run build:api

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect infrastructure image changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || [[ -z "${BEFORE_SHA}" ]] \
            || [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "${GITHUB_SHA}")"
          else
            changed_files="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"
          fi
          if grep -Eq '^docker/Dockerfile\.embedding$' <<<"${changed_files}"; then
            echo "embedding=true" >>"${GITHUB_OUTPUT}"
          else
            echo "embedding=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: openkt-next-dokku-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # One implementation of the deploy, shared with scripts/deploy-from-box.sh: archive (+ build-info.json
      # carrying this commit) → S3 ci/<sha> → SSM → dokku git:from-archive (release-phase migrations, then the
      # .dokku/app.json healthcheck before traffic moves). The archive is removed afterwards.
      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DOKKU_INSTANCE_ID: ${{ vars.DOKKU_INSTANCE_ID }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
          DEPLOY_EMBEDDING: ${{ steps.changes.outputs.embedding }}
        run: bash deploy/dokku/ship.sh "${GITHUB_SHA}"

      # Passes only when the public /v1/meta reports the commit just shipped (and auth still refuses a
      # tokenless call). Each failed attempt prints curl's reason; a final failure prints DNS/TLS diagnostics.
      - name: Smoke test the public endpoint
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          [ -n "${PUBLIC_URL}" ] || { echo "PUBLIC_URL not set; skipping"; exit 0; }
          bash deploy/dokku/smoke.sh "${PUBLIC_URL}" "${GITHUB_SHA}"
