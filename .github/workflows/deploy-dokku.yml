name: Deploy to Dokku

# Same private deployment path as the original OpenKT backend (designed by Ojas Sinha):
# GitHub OIDC → short-lived AWS session → immutable source archive in S3 → Systems Manager
# streams it into Dokku. No SSH, no stored AWS keys. See docs/DEPLOY.md.

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "docker/**"
      - ".dokku/**"
      - ".github/workflows/deploy-dokku.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openkt-next-dokku-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate server
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Type-check
        working-directory: server
        run: npm run typecheck

      - name: Unit tests
        working-directory: server
        run: npm run test:unit

      - name: Build API
        working-directory: server
        run: npm run build:api

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect infrastructure image changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || [[ -z "${BEFORE_SHA}" ]] \
            || [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "${GITHUB_SHA}")"
          else
            changed_files="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"
          fi
          if grep -Eq '^docker/Dockerfile\.embedding$' <<<"${changed_files}"; then
            echo "embedding=true" >>"${GITHUB_OUTPUT}"
          else
            echo "embedding=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: openkt-next-dokku-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload immutable source archive
        id: artifact
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          artifact_key="ci/${GITHUB_SHA}/openkt-next.tar"
          artifact_path="${RUNNER_TEMP}/openkt-next.tar"
          # Only what the images need — keeps the archive small.
          git archive --format=tar --output="${artifact_path}" "${GITHUB_SHA}" server docker .dokku .dockerignore
          aws s3 cp "${artifact_path}" "s3://${ARTIFACT_BUCKET}/${artifact_key}" --only-show-errors
          echo "uri=s3://${ARTIFACT_BUCKET}/${artifact_key}" >>"${GITHUB_OUTPUT}"

      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DOKKU_INSTANCE_ID: ${{ vars.DOKKU_INSTANCE_ID }}
          ARTIFACT_URI: ${{ steps.artifact.outputs.uri }}
          DEPLOY_EMBEDDING: ${{ steps.changes.outputs.embedding }}
        run: |
          set -euo pipefail
          parameters="$(
            jq -cn \
              --arg artifact "${ARTIFACT_URI}" \
              --arg embedding "${DEPLOY_EMBEDDING}" \
              '{
                commands: [
                  "if [ -z \"${BASH_VERSION:-}\" ]; then exec /bin/bash \"$0\" \"$@\"; fi",
                  "set -euo pipefail",
                  ("ARTIFACT_URI=" + ($artifact | @sh)),
                  "deploy_app() { aws s3 cp \"${ARTIFACT_URI}\" - --only-show-errors | dokku git:from-archive \"$1\" --; }",
                  (if $embedding == "true" then "deploy_app openkt-next-embedding" else "echo \"Embedding image unchanged; skipping\"" end),
                  "dokku ps:set openkt-next-api procfile-path .dokku/Procfile.api",
                  "deploy_app openkt-next-api",
                  "for app in openkt-next-api openkt-next-embedding; do dokku ps:report \"$app\"; done"
                ]
              }'
          )"
          command_id="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --instance-ids "${DOKKU_INSTANCE_ID}" \
              --document-name AWS-RunShellScript \
              --comment "Deploy OpenKT next ${GITHUB_SHA}" \
              --timeout-seconds 2400 \
              --parameters "${parameters}" \
              --query "Command.CommandId" \
              --output text
          )"
          while true; do
            if invocation="$(
              aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${command_id}" \
                --instance-id "${DOKKU_INSTANCE_ID}" \
                --output json 2>/dev/null
            )"; then
              status="$(jq -r ".Status" <<<"${invocation}")"
            else
              status="Pending"; invocation=""
            fi
            case "${status}" in
              Success)
                jq -r ".StandardOutputContent" <<<"${invocation}"; break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                jq -r ".StandardOutputContent, .StandardErrorContent" <<<"${invocation}"; exit 1 ;;
              *)
                echo "SSM deployment status: ${status}"; sleep 10 ;;
            esac
          done

      - name: Remove source archive
        if: always() && steps.artifact.outputs.uri != ''
        shell: bash
        env:
          ARTIFACT_URI: ${{ steps.artifact.outputs.uri }}
        run: aws s3 rm "${ARTIFACT_URI}" --only-show-errors

      - name: Smoke test the public endpoint
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          [ -n "${PUBLIC_URL}" ] || { echo "PUBLIC_URL not set; skipping"; exit 0; }
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/v1/projects" || true)"
            [ "${code}" = "401" ] && { echo "API is up (401 without a token, as expected)"; exit 0; }
            sleep 5
          done
          echo "API did not come up: last status ${code}"; exit 1
