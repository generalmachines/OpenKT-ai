name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspaces:
    name: Packages and desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each command runs the script in every workspace that defines it
      # (packages/* and apps/*) and skips the ones that do not.
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
      - run: npm run build --workspaces --if-present
      # packages/mcp-cards/dist/openkt-cards.html is committed on purpose: it is the
      # file the server serves. A build that changes it means the bundle is stale.
      - name: Committed cards bundle is up to date
        run: git diff --exit-code -- packages/mcp-cards/dist

  # ── desktop e2e journey (added by qa/e2e-loop; findings: e2e/artifacts/summary.json) ─────────────
  # Launches the real Electron app under xvfb and drives it like a person against the live server:
  # sign up, write a note, find it with ⌘K, share it, a teammate signs in and recalls it. Pull requests
  # that touch apps/desktop/** only. Screenshots, logs and summary.json are uploaded either way.
  desktop-e2e:
    name: Desktop journey (live server)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Report-only while the blockers other areas own (onboarding, server) are open — see the job summary.
    # Delete this line once `npm run e2e` exits 0 on main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did this pull request touch apps/desktop?
        id: scope
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^apps/desktop/'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npm run build -w @openkt/agents
      - if: steps.scope.outputs.run == 'true'
        name: xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - if: steps.scope.outputs.run == 'true'
        name: Journey (builds the app, then exits 1 on any BLOCKER)
        env:
          OPENKT_E2E_SERVER: https://api.openkt.ai
          # A pair of existing accounts (e2e-<id>-a/-b) to sign in as. Unset: two new accounts per run,
          # which the server's sign-up limit refuses from a shared IP.
          OPENKT_E2E_ACCOUNTS: ${{ vars.OPENKT_E2E_ACCOUNTS }}
        run: npm run e2e -w @openkt/desktop
      - if: always() && steps.scope.outputs.run == 'true'
        name: Summary
        run: |
          S=apps/desktop/e2e/artifacts/summary.json
          test -f "$S" || exit 0
          echo '### Desktop journey' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.totals | "blocker \(.blocker) · major \(.major) · minor \(.minor) · REAL \(.REAL) · MOCK \(.MOCK) · BROKEN \(.BROKEN)"' "$S" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.findings[] | select(.severity=="blocker") | "- **\(.owner)** \(.screen) — \(.item)"' "$S" >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: apps/desktop/e2e/artifacts
          retention-days: 14
          if-no-files-found: warn
  # ── end desktop e2e ───────────────────────────────────────────────────────────────────────────────

  server:
    name: Server
    runs-on: ubuntu-latest
    # The server was imported as a snapshot and its phase-A cleanup is still in flight on
    # another branch. Until that lands, this job reports problems without failing the run.
    # Remove continue-on-error once the cleanup is merged and the job is green.
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. The e2e tests need a Postgres with pgvector and are not run here yet.
      - run: npm run test:unit

  plugin:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `claude plugin validate` checks the manifests on disk. It needs no account,
      # API key or other secret, so it is safe to run on pull requests from forks.
      - run: npm install --global @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate plugin --strict
      - name: Validate the repository-root marketplace
        run: claude plugin validate . --strict
