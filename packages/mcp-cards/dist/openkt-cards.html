<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OpenKT</title>
<style>:root {
color-scheme: light dark;
--kt-bg: #ffffff;
--kt-ink: #1a1a18;
--kt-ink-2: #55544f;
--kt-muted: #6b6a65;
--kt-line: #e8e7e3;
--kt-line-strong: #c9c8c3;
--kt-soft: #f7f7f5;
--kt-primary-bg: #1a1a18;
--kt-primary-ink: #ffffff;
--kt-danger: #9a3b3b;
--k-decision: #b4532a;
--k-fact: #4f6471;
--k-howto: #55544f;
--k-question: #9b771a;
--k-action: #3f6b4f;
--k-idea: #75598a;
--k-issue: #9a3b3b;
--kt-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
--kt-mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
--kt-bg: #1c1c1a; --kt-ink: #f1f0ec; --kt-ink-2: #c4c3bd; --kt-muted: #9c9b95;
--kt-line: #34332f; --kt-line-strong: #55544f; --kt-soft: #262624;
--kt-primary-bg: #f1f0ec; --kt-primary-ink: #1a1a18; --kt-danger: #e08a8a;
--k-decision: #d9774a; --k-fact: #8aa3b3; --k-howto: #a3a29c; --k-question: #c9a23c;
--k-action: #7fb093; --k-idea: #b094c6; --k-issue: #e08a8a;
}
}
:root[data-theme="dark"] {
--kt-bg: #1c1c1a; --kt-ink: #f1f0ec; --kt-ink-2: #c4c3bd; --kt-muted: #9c9b95;
--kt-line: #34332f; --kt-line-strong: #55544f; --kt-soft: #262624;
--kt-primary-bg: #f1f0ec; --kt-primary-ink: #1a1a18; --kt-danger: #e08a8a;
--k-decision: #d9774a; --k-fact: #8aa3b3; --k-howto: #a3a29c; --k-question: #c9a23c;
--k-action: #7fb093; --k-idea: #b094c6; --k-issue: #e08a8a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body {
font-family: var(--kt-sans); color: var(--kt-ink); font-size: 14px; line-height: 1.5;
-webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
padding: 1px;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
button:disabled { cursor: default; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--kt-ink); outline-offset: 2px; }
.mono { font-family: var(--kt-mono); }
.card {
border: 1px solid var(--kt-line); border-radius: 16px; background: var(--kt-bg);
padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.card.is-list { padding: 18px 18px 8px; gap: 4px; }
.head { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.is-list .head { padding-bottom: 6px; }
.brand { font-size: 13px; font-weight: 600; flex-shrink: 0; }
.sub { font-size: 11px; color: var(--kt-muted); flex: 1 1 auto; min-width: 0; }
.scope { font-size: 11px; color: var(--kt-muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statement { margin: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.statement.is-long { max-height: 9em; overflow: auto; }
.metaline { font-family: var(--kt-mono); font-size: 11px; color: var(--kt-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--kt-ink-2); width: 78px; flex-shrink: 0; font-family: var(--kt-mono); white-space: nowrap; }
.kind i { width: 7px; height: 7px; border-radius: 2px; background: var(--k-fact); display: inline-block; flex-shrink: 0; }
.kind[data-k="decision"] i { background: var(--k-decision); }
.kind[data-k="fact"] i { background: var(--k-fact); }
.kind[data-k="how-to"] i { background: var(--k-howto); }
.kind[data-k="question"] i { background: var(--k-question); }
.kind[data-k="action"] i { background: var(--k-action); }
.kind[data-k="idea"] i { background: var(--k-idea); }
.kind[data-k="issue"] i { background: var(--k-issue); }
.spaces { display: flex; flex-direction: column; gap: 8px; }
.space {
display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 14px; width: 100%;
border-radius: 10px; border: 1px solid var(--kt-line); background: var(--kt-bg);
}
.space:hover:not(:disabled) { border-color: var(--kt-line-strong); }
.space[aria-checked="true"] { border-color: var(--kt-ink); }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--kt-line-strong); flex-shrink: 0; }
.space[aria-checked="true"] .dot { border: 5px solid var(--kt-ink); }
.space .txt { display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0; }
.space .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.space .note { font-family: var(--kt-mono); font-size: 10.5px; color: var(--kt-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.space.more .dot { border-style: dashed; }
.filter {
width: 100%; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--kt-line);
background: var(--kt-soft); color: var(--kt-ink); font: inherit; font-size: 13.5px;
}
.filter:focus-visible { outline: none; border-color: var(--kt-ink); }
.filter::placeholder { color: var(--kt-muted); }
.scroll { display: flex; flex-direction: column; gap: 8px; max-height: 232px; overflow-y: auto; padding: 1px; margin: -1px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.status { font-family: var(--kt-mono); font-size: 11px; color: var(--kt-muted); margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.status.is-error { color: var(--kt-danger); }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--kt-line); background: var(--kt-bg); font-size: 13.5px; text-align: center; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--kt-line-strong); }
.btn.primary { padding: 0 22px; border-color: var(--kt-primary-bg); background: var(--kt-primary-bg); color: var(--kt-primary-ink); font-weight: 500; }
.btn:disabled { opacity: .55; }
.btn.small { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 12px; }
.item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; width: 100%; border-bottom: 1px solid var(--kt-line); color: var(--kt-ink); }
.item:last-of-type { border-bottom: 0; }
.item .kind { padding-top: 3px; }
.item .body { display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-width: 0; }
.item .text { font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
.item .meta { font-family: var(--kt-mono); font-size: 10.5px; color: var(--kt-muted); overflow-wrap: anywhere; display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
.item .pin { flex-shrink: 0; visibility: hidden; }
.item:hover .pin, .item:focus-visible .pin, .item[aria-pressed="true"] .pin { visibility: visible; }
.item[aria-pressed="true"] .pin { color: var(--kt-ink); }
.item:hover .text { text-decoration: underline; text-decoration-color: var(--kt-line-strong); text-underline-offset: 3px; }
.foot { font-family: var(--kt-mono); font-size: 10.5px; color: var(--kt-muted); padding: 10px 0 8px; display: flex; gap: 10px; flex-wrap: wrap; }
.foot.is-error { color: var(--kt-danger); }
.empty { margin: 0; padding: 6px 0 12px; font-size: 14.5px; color: var(--kt-ink-2); }
.title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.para { margin: 0; font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
.label { font-family: var(--kt-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--kt-muted); margin: 6px 0 0; }
.rows { display: flex; flex-direction: column; }
.rows .item { padding: 10px 0; cursor: default; }
.rows .item:hover .text { text-decoration: none; }
.stats { display: flex; gap: 6px 18px; flex-wrap: wrap; font-family: var(--kt-mono); font-size: 11px; color: var(--kt-muted); border-top: 1px solid var(--kt-line); padding-top: 12px; }
.stats b { color: var(--kt-ink); font-weight: 500; }
@media (max-width: 440px) {
.card { padding: 16px; }
.card.is-list { padding: 16px 16px 6px; }
.item { flex-wrap: wrap; gap: 4px 12px; }
.item .kind { width: auto; padding-top: 0; flex: 1 1 auto; }
.item .body { flex-basis: 100%; order: 3; }
.item .pin { display: none; }
.item[aria-pressed="true"] .pin { display: inline; }
.metaline .kind { width: auto; }
.actions .btn { flex: 1 1 0; }
.status { flex-basis: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
.space, .btn, .item .pin { transition: border-color .12s ease, color .12s ease, opacity .12s ease; }
}</style>
</head>

<main id="root" class="card" aria-live="polite" aria-busy="true">
  <header class="head"><span class="brand">OpenKT</span><span class="sub mono">loading</span></header>
</main>
