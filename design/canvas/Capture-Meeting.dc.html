<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#1a1a18;background:#fff;-webkit-font-smoothing:antialiased}
a{color:#b4532a}a:hover{color:#8f3f1e}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace}

</style>
</helmet>
<div style="width: 760px; height: 460px; box-sizing: border-box; background: #d9d7d1; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 40px;">
<div aria-hidden="true" style="position: absolute; left: 60px; top: 44px; width: 640px; height: 330px; border-radius: 12px; background: #ecebe7; border: 1px solid #c9c8c3; box-sizing: border-box; padding: 40px 36px; display: flex; flex-direction: column; gap: 12px;">
<span style="width: 46%; height: 14px; border-radius: 4px; background: #d9d7d1;"></span><span style="width: 82%; height: 9px; border-radius: 4px; background: #dedcd6;"></span><span style="width: 74%; height: 9px; border-radius: 4px; background: #dedcd6;"></span><span style="width: 79%; height: 9px; border-radius: 4px; background: #dedcd6;"></span><span style="width: 38%; height: 9px; border-radius: 4px; background: #dedcd6;"></span>
</div>
<div style="position: absolute; right: 24px; top: 24px; width: 360px; box-sizing: border-box; background: #fff; border: 1px solid #c9c8c3; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;"><span style="color: #55544f; display: flex;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10.5l5-3v9l-5-3"></path></svg></span><span style="font-size: 14.5px; font-weight: 500; flex-grow: 1;">Google Meet is using your mic</span></div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #55544f;">Keep this meeting as a session? It is transcribed on this Mac. No bot joins, and the audio is never uploaded.</p>
<div style="display: flex; gap: 8px;">
<button style="flex-grow: 1; height: 44px; border-radius: 10px; border: none; background: #1a1a18; color: #fff; font-size: 13.5px; font-weight: 500;">Record</button>
<button style="flex-grow: 1; height: 44px; border-radius: 10px; border: 1px solid #e8e7e3; background: #fff; font-size: 13.5px;">Not this one</button>
</div>
<span class="mono" style="font-size: 11px; color: #6b6a65;">tell the others you are recording</span>
</div>
<div style="position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 20px; background: #fff; border: 1px solid #c9c8c3;">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #b4532a;"></span><span style="font-size: 13px;">Recording · Pricing call with Northgate</span><span class="mono" style="font-size: 11.5px; color: #6b6a65;">12:41</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":460}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
